<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="theme-color" content="#0a1020">
<title>Base War</title>
<style>
:root{--bg:#0a1020;--ink:#f4f7ff;--red:#ff4d5e;--blue:#3d8bff;--gold:#ffc83d;--card:#1b2a52}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:"Kanit","Noto Sans Thai",system-ui,sans-serif}
#wrap{position:fixed;inset:0;font-size:16px}
body.rot #wrap{inset:auto;top:0;left:100vw;width:100vh;width:100dvh;height:100vw;height:100dvw;transform-origin:0 0;transform:rotate(90deg)}
canvas{width:100%;height:100%;display:block;background:#101a33}
#feed{position:absolute;left:8px;bottom:56px;font-size:13px;pointer-events:none;display:flex;flex-direction:column;gap:3px;z-index:2}
#feed div{background:#000a;padding:3px 10px;border-radius:12px;width:fit-content;max-width:90%}
#gear{position:absolute;bottom:8px;width:40px;height:40px;border:0;border-radius:50%;background:#000a;color:#fff;font-size:20px;z-index:5}
#gear{left:8px}
#fs{position:absolute;bottom:8px;left:56px;width:40px;height:40px;border:0;border-radius:50%;background:#000a;color:#fff;font-size:20px;z-index:5;padding:0}
.ov{position:absolute;inset:0;z-index:3;display:none;flex-direction:column;align-items:center;justify-content:center;gap:.4em;text-align:center}
.ov.on{display:flex}
#home{pointer-events:none;background:radial-gradient(ellipse at center,rgba(10,16,32,.1),rgba(10,16,32,.65))}.ttl{font-size:2.4em;font-weight:700;letter-spacing:.06em;background:linear-gradient(#fff,#ffc83d);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 2px 6px #000c)}
#home>*{pointer-events:auto}
#res{background:radial-gradient(circle at 50% 35%,#1d2f63,#0a1020 75%)}
.sub{font-size:.8em;color:#8fa3d6}
.big{font-size:1.5em;font-weight:600}
#start{font-size:1.8em;font-weight:600;padding:.45em 1.8em;border-radius:.7em;background:var(--gold);color:#0a1020}
#rnext{font-size:1.1em;font-weight:600;padding:.4em 1.6em;border-radius:.6em;background:linear-gradient(#ffd966,#ffb81c);box-shadow:0 .12em 0 #a06c00;color:#0a1020;margin-top:.3em}
#rav{position:relative;width:6.5em;height:6.5em;border-radius:50%;overflow:hidden;background:#26356a;border:.2em solid #fff;box-shadow:0 0 1.2em rgba(255,200,61,.6);display:flex;align-items:center;justify-content:center}
#rl{font-size:3em;font-weight:600}
#rimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#panel{position:absolute;inset:0;z-index:10;background:#0a1020ee;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);padding:14px;overflow-y:auto;overscroll-behavior:contain;display:none;font-size:16px}
body.rot #panel{touch-action:none}
#panel.on{display:block}
.ph{display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;margin:0 -14px 6px;padding:10px 14px;background:#0a1020;z-index:3}
#close{position:sticky;bottom:6px;z-index:3}
h2{font-size:17px;margin:14px 0 8px}
input,select,button{font:inherit;font-size:16px;color:var(--ink)}
input,select{background:var(--card);border:1px solid #34467a;border-radius:8px;padding:8px;min-width:0}
button{border:0;border-radius:10px;padding:8px 12px;background:linear-gradient(#26396f,#1b2a52);box-shadow:inset 0 1px 0 #fff2,0 2px 4px #0006}button:active{transform:scale(.96)}
.main{background:var(--red);font-weight:600}
.row{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.row input{flex:2 1 140px}.row select{flex:1 1 110px}
.r{background:#7a2330}.b{background:#1f4a8f}
#st{font-size:14px;color:var(--gold);margin-top:6px}
#dbg{font-size:10px;color:#8fa3d6;white-space:pre-wrap;word-break:break-all;max-height:80px;overflow:auto;margin:6px 0 0}
#seen button{margin:0 6px 6px 0;background:#26356a}
.big,.sub,#feed div,#ann,.tr{text-shadow:-1px -1px 0 #000,1px -1px 0 #000,-1px 1px 0 #000,1px 1px 0 #000,0 2px 4px #000a}
#ann{position:absolute;top:26%;left:50%;transform:translateX(-50%);z-index:4;display:none;background:#000b;border:.1em solid var(--gold);padding:.3em 1em;border-radius:1em;font-weight:600;white-space:nowrap;pointer-events:none}
#ann.on{display:block}
#rm{display:flex;flex-direction:column;align-items:center;gap:.4em}
#rtop{display:none;flex-direction:column;gap:.3em;width:min(24em,90%)}
.tr{display:flex;align-items:center;gap:.5em;background:#1b2a52;border-left:.25em solid;padding:.2em .5em;border-radius:.5em;font-size:.8em}
.tr b{width:1.2em;color:var(--gold)}.tr .nm{flex:1;text-align:left;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.av{position:relative;width:1.6em;height:1.6em;border-radius:50%;overflow:hidden;background:#26356a;display:flex;align-items:center;justify-content:center}
.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
</style>
</head>
<body>
<div id="wrap">
<canvas id="c" width="640" height="360"></canvas>
<div id="feed"></div>
<button id="gear" aria-label="ตั้งค่า">⚙</button>
<button id="fs" aria-label="เต็มจอ">⛶</button>
<div id="home" class="ov on">
  <div class="ttl">⚔ BASE WAR ⚔</div><div class="big" id="hmt"></div>
</div>
<div id="ann"></div>
<div id="res" class="ov">
  <div id="rttl" class="big"></div>
  <div id="rm"><div id="rmvp" class="sub">MVP</div>
  <div id="rav"><span id="rl"></span><img id="rimg" alt=""></div>
  <div id="rname" class="big"></div>
  <div id="rdia" class="sub"></div></div>
  <div id="rtop"></div>
  <div id="rcnt" class="sub"></div>
  <button id="rnext">ถัดไป</button>
</div>
<div id="panel">
  <div class="ph"><h2 style="margin:0">เชื่อมต่อ TikTok LIVE</h2></div>
  <div class="row"><input id="u" placeholder="ชื่อ TikTok (ไม่ต้องใส่ @)"><button class="main" id="go">เชื่อมต่อ</button></div>
  <div class="row"><input id="k" type="password" placeholder="Euler API key (euler_...)"></div>
  <div id="st">ยังไม่ได้เชื่อมต่อ</div>
  <pre id="dbg"></pre>
  <button id="rstg" style="width:100%;margin-top:10px">↻ รีเซ็ตเกม / กลับหน้าหลัก</button>
  <button id="rsw" style="width:100%;margin-top:6px">รีเซ็ตคะแนน WIN</button>
  <h2>กติกาของขวัญ</h2>
  <div id="rules"></div>
  <button id="add">+ เพิ่มของขวัญ</button>
  <h2>ของขวัญที่เพิ่งได้รับ (กดเพื่อเพิ่มกติกา)</h2>
  <div id="seen">ยังไม่มี</div>
  <button class="main" id="close" style="margin-top:16px;width:100%">กลับไปเกม</button>
</div>
</div>
<script>
const $=id=>document.getElementById(id);
const cv=$('c'),g=cv.getContext('2d'),feed=$('feed');
const _ft=g.fillText.bind(g);g.fillText=(t,x,y)=>{g.save();g.lineJoin='round';g.lineWidth=3;g.strokeStyle='#000';g.strokeText(t,x,y);g.restore();_ft(t,x,y)};
const W=640,BASE_HP=9999,SEA_T=60*240,WARN=600,CAP=Infinity;
const AUTO=true,HEAL_AFTER=60*60,HEAL_EVERY=60*60,HEAL_AMT=100,RESULT_SEC=10,NAME_ALL=true,HOME_SEC=10;
let H=360,SC=1,phase='home';
const FX={soldier:'ทหาร',archer:'พลธนู',shield:'ทหารโล่',tank:'รถถัง',cav:'ทหารม้า',boss:'บอส',heal:'ซ่อมฐาน',jets:'เครื่องบินทิ้งระเบิด'};
const TY={
  soldier:{hp:50,dmg:2.5,cd:60,sp:.367,r:6,rng:12},
  archer:{hp:30,dmg:4,cd:60,sp:.367,r:6,rng:90},
  shield:{hp:100,dmg:2,cd:90,sp:.267,r:8,rng:12},
  tank:{hp:30,dmg:8,cd:60,sp:.317,r:10,rng:120},
  cav:{hp:30,dmg:5,cd:54,sp:.467,r:8,rng:14},
  boss:{hp:1000,dmg:15,cd:60,sp:.217,r:20,rng:26}
};
const COL={red:'#ff4d5e',blue:'#3d8bff'};
const DK={red:'#a82a37',blue:'#2457b8'};
const NAME={red:'ทหารฝั่งแดง',blue:'ทหารฝั่งน้ำเงิน'};
function load(k,d){try{return JSON.parse(localStorage.getItem(k))||d}catch(e){return d}}
function save(){try{localStorage.setItem('rules3',JSON.stringify(rules));localStorage.setItem('user',JSON.stringify($('u').value));localStorage.setItem('key',JSON.stringify($('k').value))}catch(e){}}
let rules=load('rules3',[
  {gift:'Rose',fx:'soldier'},{gift:'TikTok',fx:'soldier'},{gift:'Heart Me',fx:'archer'},
  {gift:'Lion',fx:'cav'},{gift:'Universe',fx:'boss'}]);
rules.forEach(r=>{if(r.fx==='horde')r.fx='cav'});
$('u').value=load('user','');$('k').value=load('key','');
var BGC={};let wins=load('wins',{red:0,blue:0});const seen=[],teams={},profiles={};
function fit(){
  const w=innerWidth,h=innerHeight,p=h>w;document.body.classList.toggle('rot',p);
  const vw=p?h:w,vh=p?w:h;
  H=Math.max(260,Math.min(440,Math.round(W*vh/vw)));const ns=Math.min(2.5,Math.max(1,Math.round(vw*(devicePixelRatio||1)/W*2)/2));if(SC!==ns||cv.height!==Math.round(H*ns)){SC=ns;cv.width=Math.round(W*SC);cv.height=Math.round(H*SC);for(const k in BGC)delete BGC[k]}
  $('wrap').style.fontSize=Math.max(11,vh/22)+'px';
}
addEventListener('resize',fit);fit();
function prof(user,nick,pic){
  const p=profiles[user]||(profiles[user]={nick:user,pic:'',img:null});
  if(nick)p.nick=nick;
  if(pic&&pic!==p.pic){p.pic=pic;const im=new Image();im.referrerPolicy='no-referrer';im.src=pic;p.img=im}
  return p;
}
function picOf(U){
  if(!U)return '';
  const c=[];
  const add=v=>{if(!v)return;if(typeof v==='string')c.push(v);else if(Array.isArray(v))v.forEach(add);else if(typeof v==='object'){add(v.url);add(v.urls);add(v.urlList);add(v.url_list)}};
  add(U.profilePictureUrl);add(U.profilePicture);add(U.avatarThumb);add(U.avatarMedium);add(U.avatarLarger);add(U.profilePictureUrls);
  return c.find(u=>/\.(jpe?g|png)/i.test(u))||c.find(u=>/^https?:/.test(u))||'';
}

// ---------- game ----------
let S;
function reset(){S={t:0,time:0,hp:{red:BASE_HP,blue:BASE_HP},dia:{red:0,blue:0},board:{red:{},blue:{}},
  un:[],fx:[],ln:[],ar:[],tx:[],win:null,mvp:{},flash:0,started:0,
  calm:{red:0,blue:0},prev:{red:0,blue:0},delta:{red:0,blue:0},jt:[],bm:[],ex:[],nx:null,as:0,hl:{red:0,blue:0}}}
reset();
function note(txt,team){
  const d=document.createElement('div');d.textContent=txt;
  d.style.borderLeft='4px solid '+(COL[team]||'#fff');feed.appendChild(d);
  setTimeout(()=>d.remove(),4000);
  while(feed.children.length>4)feed.firstChild.remove();
}
function boom(x,y,c){for(let i=0;i<6;i++)S.fx.push({x,y,vx:(Math.random()-.5)*4,vy:(Math.random()-.5)*4,l:20,c})}
function count(team){let n=0;for(const u of S.un)if(u.team===team)n++;return n}
function spawn(team,type,n,user){
  for(let i=0;i<n;i++){
    if(count(team)>=CAP)return;
    const T=TY[type];
    const x=team==='red'?30+Math.random()*30:W-30-Math.random()*30;
    S.un.push({team,type,user,lead:i===0,x,y:70+Math.random()*(H-110),hp:T.hp,max:T.hp,cd:Math.random()*T.cd,
      dmg:T.dmg,cdMax:T.cd,sp:T.sp,r:T.r,rng:T.rng,ph:Math.random()*6,at:0,hit:0,mv:0,face:team==='red'?1:-1});
  }
}
function teamOf(user,force){
  if(force)return force;
  if(teams[user])return teams[user];
  let r=0,b=0;for(const k in teams)teams[k]==='red'?r++:b++;
  const t=r<b?'red':b<r?'blue':(Math.random()<.5?'red':'blue');
  teams[user]=t;return t;
}
function setTeam(user,text){
  const m=/(แดง|red)/i.test(text)?'red':/(น้ำเงิน|นํ้าเงิน|ฟ้า|blue)/i.test(text)?'blue':null;
  if(!m||teams[user]===m)return;
  teams[user]=m;note(`${user} เข้า${NAME[m]}`,m);
}
function onGift({user='ผู้ชม',nick,pic,gift='Rose',diamonds=1,count:n=1,team:force}){
  if(!seen.includes(gift)){seen.unshift(gift);seen.length=Math.min(seen.length,8);renderSeen()}
  if(phase!=='play')return;
  prof(user,nick,pic);
  S.started=1;
  const team=teamOf(user,force),foe=team==='red'?'blue':'red';
  const v=diamonds*n;
  S.dia[team]+=v;S.board[team][user]=(S.board[team][user]||0)+v;
  const r=rules.find(r=>r.gift.trim().toLowerCase()===String(gift).toLowerCase());
  const d=diamonds;
  const fx=r&&FX[r.fx]?r.fx:(d>=200?'boss':d>=100?'jets':d>=30?'cav':d>=10?'tank':d>=5?'shield':d>=2?'archer':'soldier');
  if(fx==='soldier')spawn(team,'soldier',5*n,user);
  else if(fx==='archer')spawn(team,'archer',5*n,user);
  else if(fx==='shield')spawn(team,'shield',3*n,user);
  else if(fx==='tank')spawn(team,'tank',3*n,user);
  else if(fx==='cav')spawn(team,'cav',5*n,user);
  else if(fx==='boss')spawn(team,'boss',n,user);
  else if(fx==='jets')squadron(team,n,user);
  else if(fx==='heal'){S.hp[team]=Math.min(BASE_HP,S.hp[team]+50*n)}
  note(`${prof(user).nick} ส่ง ${gift} ×${n} → ${FX[fx]} (${NAME[team]})`,team);
}
function hitBase(t,d){S.hp[t]-=d;S.calm[t]=0;S.hl[t]=0}
function hurt(e,d){e.hp-=d*(e.type==='shield'?.35:1);e.hit=4}
function shoot(u,ang){const sh=u.type==='tank',v=sh?4:5;S.ar.push({x:u.x,y:u.y-2,vx:Math.cos(ang)*v,vy:Math.sin(ang)*v,team:u.team,dmg:u.dmg,l:sh?60:40,sh,bd:sh?.6:.5})}
function updArrows(){
  for(const a of S.ar){
    a.x+=a.vx;a.y+=a.vy;a.l--;
    for(const e of S.un){if(e.team!==a.team&&e.hp>0&&Math.hypot(e.x-a.x,e.y-a.y)<e.r+3){
      hurt(e,a.dmg);
      if(a.sh){for(const o of S.un){if(o!==e&&o.team!==a.team&&o.hp>0&&Math.hypot(o.x-a.x,o.y-a.y)<22)hurt(o,a.dmg*.6)}boom(a.x,a.y,'#ffb23d')}
      a.l=0;boom(a.x,a.y,COL[a.team]);break}}
    if(a.l>0){
      if(a.team==='red'&&a.x>=W-24){if(count('blue')===0)hitBase('blue',a.dmg*a.bd);a.l=0;if(a.sh)boom(a.x,a.y,'#ffb23d')}
      else if(a.team==='blue'&&a.x<=24){if(count('red')===0)hitBase('red',a.dmg*a.bd);a.l=0;if(a.sh)boom(a.x,a.y,'#ffb23d')}
    }
  }
  S.ar=S.ar.filter(a=>a.l>0);
}
function update(){
  S.t++;
  if(phase!=='play'||!S.started)return;
  S.time++;seasonTick();const EF=EFX[seaKey];
  if(S.t%90===0){for(const t of ['red','blue']){const c=count(t);S.delta[t]=c-S.prev[t];S.prev[t]=c}}
  for(const t of ['red','blue']){
    if(++S.calm[t]>=(S.hl[t]?HEAL_EVERY:HEAL_AFTER)){
      S.calm[t]=0;S.hl[t]=1;
      if(S.hp[t]>0&&S.hp[t]<BASE_HP){
        S.hp[t]=Math.min(BASE_HP,S.hp[t]+HEAL_AMT);
        S.tx.push({x:t==='red'?34:W-34,y:(64+H-16)/2,t:'+'+HEAL_AMT,l:70});
      }
    }
  }
  for(const u of S.un){
    u.cd-=EF.atk;if(EF.dr&&u.hp>1)u.hp=Math.max(1,u.hp-u.max*EF.dr/60);if(u.at>0)u.at--;if(u.hit>0)u.hit--;u.mv=0;
    let tg=null,best=1e9;
    for(const e of S.un){if(e.team!==u.team&&e.hp>0){const k=Math.hypot(e.x-u.x,e.y-u.y);if(k<best){best=k;tg=e}}}
    if(tg){
      if(best<=u.rng+tg.r){
        if(u.cd<=0){u.cd=u.cdMax;u.at=10;
          if(u.rng>20)shoot(u,Math.atan2(tg.y-u.y,tg.x-u.x));
          else{tg.hp-=u.dmg;tg.hit=4;S.ln.push({x1:u.x,y1:u.y,x2:tg.x,y2:tg.y,l:3,c:COL[u.team]})}}
      }else{u.x+=(tg.x-u.x)/best*u.sp;u.y+=(tg.y-u.y)/best*u.sp;u.mv=1}
    }else{
      const red=u.team==='red',dist=red?W-24-u.x:u.x-24;
      if(dist<=u.rng){
        if(u.cd<=0){u.cd=u.cdMax;u.at=10;const f=red?'blue':'red';
          if(u.rng>20)shoot(u,red?0:Math.PI);
          else{hitBase(f,u.dmg);boom(red?W-24:24,u.y,COL[u.team])}}
      }else{u.x+=(red?1:-1)*u.sp;u.y+=(Math.random()-.5)*.6;u.y=Math.max(66,Math.min(H-24,u.y));u.mv=1}
    }
    if(u.mv)u.ph+=u.sp*.45;
    u.face=tg?(tg.x>=u.x?1:-1):(u.team==='red'?1:-1);
  }
  updArrows();updJets();
  S.un=S.un.filter(u=>{if(u.hp<=0){boom(u.x,u.y,COL[u.team]);return false}return true});
  S.fx.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.l--});S.fx=S.fx.filter(p=>p.l>0);
  S.ln.forEach(l=>l.l--);S.ln=S.ln.filter(l=>l.l>0);
  S.tx.forEach(o=>{o.y-=.3;o.l--});S.tx=S.tx.filter(o=>o.l>0);
  if(S.flash>0)S.flash--;
  if(S.hp.red<=0)finish('blue');else if(S.hp.blue<=0)finish('red');
}

// ---------- results: winner MVP, then the other team's MVP ----------
let rq=[],ri=0,rtm=null,rsec=0;
function clearRes(){clearInterval(rtm);rtm=null}
function finish(win){
  phase='result';S.win=win;wins[win]=(wins[win]||0)+1;try{localStorage.setItem('wins',JSON.stringify(wins))}catch(e){}
  for(const t of ['red','blue']){
    const e=Object.entries(S.board[t]).sort((a,b)=>b[1]-a[1])[0];
    S.mvp[t]=e?{user:e[0],v:e[1]}:null;
  }
  S.top=[];for(const t of ['red','blue'])for(const u in S.board[t])S.top.push({user:u,v:S.board[t][u],t});S.top.sort((a,b)=>b.v-a.v);S.top=S.top.slice(0,5);
  rq=[win,win==='red'?'blue':'red'];if(S.top.length)rq.push('top');ri=0;showStep();
}
function fillTop(){const b=$('rtop');b.innerHTML='';S.top.forEach((o,i)=>{const p=profiles[o.user]||{},r=document.createElement('div');r.className='tr';r.style.borderColor=COL[o.t];
  const n=document.createElement('b');n.textContent=i+1;
  const a=document.createElement('span');a.className='av';a.textContent=String(p.nick||o.user).trim().charAt(0).toUpperCase();
  if(p.pic){const im=document.createElement('img');im.referrerPolicy='no-referrer';im.onerror=()=>im.remove();im.src=p.pic;a.append(im)}
  const nm=document.createElement('span');nm.className='nm';nm.textContent=(p.nick||o.user)+(i?'':' · MVP');
  const d=document.createElement('span');d.textContent='💎 '+o.v;
  r.append(n,a,nm,d);b.append(r)})}
function showStep(){
  clearRes();
  const t=rq[ri],last=ri===rq.length-1,tp=t==='top',m=tp?null:S.mvp[t];
  $('res').classList.add('on');
  $('rm').style.display=tp?'none':'flex';$('rtop').style.display=tp?'flex':'none';
  $('rttl').textContent=tp?'🏆 5 อันดับสูงสุด':(ri===0?`${NAME[t]}ชนะ!`:`${NAME[t]}`);
  $('rttl').style.color=tp?'#ffc83d':COL[t];
  if(tp)fillTop();
  else{
    $('rav').style.display=m?'flex':'none';

  g.fillStyle='rgba(0,0,0,.3)';g.beginPath();g.ellipse(0,8,u.type==='tank'||u.type==='cav'?13:6,2,0,0,7);g.fill();
  if(u.type==='tank'){
    g.fillStyle='#2b2f3a';g.fillRect(-12,2,24,6);
    g.fillStyle='#8a90a0';for(let i=-8;i<=8;i+=8){g.beginPath();g.arc(i,5,2.2,0,7);g.fill()}
    g.fillStyle=main;g.fillRect(-10,-4,20,7);
    g.fillStyle=dk;g.fillRect(-4,-9,10,6);
    g.fillStyle='#2b2f3a';g.fillRect(6-A*3,-7,14,2.5);
    if(img){g.save();g.translate(1,-6);g.beginPath();g.arc(0,0,4.5,0,7);g.clip();g.scale(d,1);g.drawImage(img,-4.5,-4.5,9,9);g.restore();
      g.strokeStyle=dk;g.lineWidth=1;g.beginPath();g.arc(1,-6,4.5,0,7);g.stroke()}
  }else if(u.type==='cav'){
    const lg=Math.sin(u.ph*1.6)*3;
    g.strokeStyle='#4a2f1a';g.lineWidth=2;
    g.beginPath();g.moveTo(-8,3);g.lineTo(-8+lg,10);g.moveTo(-5,3);g.lineTo(-5-lg,10);g.moveTo(6,3);g.lineTo(6-lg,10);g.moveTo(9,3);g.lineTo(9+lg,10);g.stroke();
    g.fillStyle='#8a5a2b';g.beginPath();g.ellipse(0,0,11,5.5,0,0,7);g.fill();
    g.beginPath();g.moveTo(8,-3);g.lineTo(14,-9);g.lineTo(18,-6);g.lineTo(10,2);g.fill();
    g.fillStyle='#2b1a0e';g.fillRect(16,-8,2,2);
    g.fillStyle=main;g.fillRect(-7,-4,11,3);
    g.fillStyle=main;g.fillRect(-3,-13,7,10);g.fillStyle=dk;g.fillRect(-3,-6,7,2);
    g.save();g.translate(0,-19);g.beginPath();g.arc(0,0,5.5,0,7);g.clip();
    if(img){g.scale(d,1);g.drawImage(img,-5.5,-5.5,11,11)}
    else{g.fillStyle='#f5cfa0';g.fillRect(-6,-6,12,12);g.fillStyle='#23283a';g.fillRect(1.5,-1.5,1.6,1.6)}
    g.restore();
    g.strokeStyle=dk;g.lineWidth=1.2;g.beginPath();g.arc(0,-19,5.5,0,7);g.stroke();
    g.strokeStyle=main;g.lineWidth=2;g.beginPath();g.arc(0,-19,5.5,Math.PI*1.15,Math.PI*1.85);g.stroke();
    g.strokeStyle='#d8dde8';g.lineWidth=1.6;g.beginPath();g.moveTo(2,-8);g.lineTo(19+A*5,-11);g.stroke();
  }else{
    g.strokeStyle='#23283a';g.lineWidth=2;
    g.beginPath();g.moveTo(-2,3);g.lineTo(-2+w,8);g.moveTo(2,3);g.lineTo(2-w,8);g.stroke();
    g.fillStyle=main;g.fillRect(-4,-4,8,8);
    g.fillStyle=dk;g.fillRect(-4,2,8,2);g.fillStyle='rgba(255,255,255,.28)';g.fillRect(-4,-4,2.5,6);g.strokeStyle='rgba(10,16,32,.7)';g.lineWidth=.8;g.strokeRect(-4,-4,8,8);
    g.save();g.translate(0,-10);g.beginPath();g.arc(0,0,6,0,7);g.clip();
    if(img){g.scale(d,1);g.drawImage(img,-6,-6,12,12)}
    else{g.fillStyle='#f5cfa0';g.fillRect(-6,-6,12,12);g.fillStyle='#23283a';g.fillRect(1.5,-1.5,1.6,1.6)}
    g.restore();
    g.strokeStyle=dk;g.lineWidth=1.2;g.beginPath();g.arc(0,-10,6,0,7);g.stroke();
    g.strokeStyle=main;g.lineWidth=2;g.beginPath();g.arc(0,-10,6,Math.PI*1.15,Math.PI*1.85);g.stroke();
    if(u.type==='archer'){
      g.fillStyle=dk;g.beginPath();g.moveTo(-5,-13);g.lineTo(0,-22);g.lineTo(5,-13);g.fill();
      g.strokeStyle='#8a5a2b';g.lineWidth=1.5;g.beginPath();g.arc(5-A*2,-1,6,-1.2,1.2);g.stroke();
      g.strokeStyle='#eeeeee';g.lineWidth=.8;g.beginPath();g.moveTo(7.6-A*2,-6.2);g.lineTo(3-A*5,-1);g.lineTo(7.6-A*2,4.2);g.stroke();
    }else{
      g.strokeStyle='#d8dde8';g.lineWidth=1.6;g.beginPath();g.moveTo(3,0);g.lineTo((u.type==='shield'?8:12)+A*4,-2);g.stroke();
      if(u.type==='shield'){const sx=4+A*3;
        g.fillStyle='#9aa1b3';g.beginPath();g.arc(0,-10,6.8,Math.PI,0);g.fill();g.fillRect(-6.8,-10,13.6,1.6);g.fillRect(-6,-4,12,3);
        g.fillStyle='#8e96a8';g.fillRect(sx,-12,10,24);g.fillStyle=main;g.fillRect(sx+1.5,-10.5,7,21);
        g.fillStyle='#e9edf5';g.fillRect(sx+4,-10.5,2,21);g.fillRect(sx+1.5,-2,7,2);
        g.strokeStyle='#4a5063';g.lineWidth=1;g.strokeRect(sx,-12,10,24)}
      if(u.type==='boss'){g.fillStyle='#ffc83d';g.beginPath();g.moveTo(-4,-16);g.lineTo(-3,-22);g.lineTo(0,-18);g.lineTo(3,-22);g.lineTo(4,-16);g.fill()}
    }
  }
  g.restore();
  if(u.max>3){
    const m=u.type==='boss'?24:12,y=u.y+topOf(u)-5;
    g.fillStyle='rgba(0,0,0,.6)';g.fillRect(u.x-m,y,m*2,3);
    g.fillStyle='#ffffff';g.fillRect(u.x-m,y,m*2*Math.max(u.hp,0)/u.max,3);
  }
}
function topOf(u){return u.type==='cav'?-27:u.type==='tank'?-12:u.type==='boss'?-51:u.type==='archer'?-23:u.type==='shield'?-22:-18}
function drawName(u){
  if(!u.user||!(NAME_ALL||u.lead))return;
  const p=profiles[u.user],nm=String((p&&p.nick)||u.user).slice(0,10);
  const y=u.y+topOf(u)-(u.max>3?8:2);
  g.font='600 '+(u.type==='boss'?12:8)+'px sans-serif';g.textAlign='center';
  g.lineWidth=2.5;g.strokeStyle='rgba(10,16,32,.85)';g.strokeText(nm,u.x,y);
  g.fillStyle='#ffffff';g.fillText(nm,u.x,y);g.lineWidth=1;
}
function rr(x,y,w,h,r){g.beginPath();if(g.roundRect)g.roundRect(x,y,w,h,r);else g.rect(x,y,w,h)}
function hpBar(x,t){const w=240*Math.max(S.hp[t],0)/BASE_HP;
 g.fillStyle='rgba(8,14,30,.8)';rr(x-2,8,244,16,8);g.fill();
 if(w>1){const gr=g.createLinearGradient(0,10,0,22);gr.addColorStop(0,'rgba(255,255,255,.55)');gr.addColorStop(.4,COL[t]);gr.addColorStop(1,DK[t]);g.fillStyle=gr;rr(t==='red'?x:x+240-w,10,w,12,6);g.fill()}
 g.strokeStyle='rgba(255,255,255,.4)';g.lineWidth=1;rr(x-2,8,244,16,8);g.stroke();
 g.font='600 9px sans-serif';g.textAlign='center';g.fillStyle='#fff';g.fillText(Math.ceil(Math.max(S.hp[t],0)),x+120,19.5)}
function vig(){const r=g.createRadialGradient(W/2,H/2,H*.45,W/2,H/2,W*.62);r.addColorStop(0,'rgba(0,0,0,0)');r.addColorStop(1,'rgba(5,10,30,.4)');g.fillStyle=r;g.fillRect(0,0,W,H)}
function draw(){g.setTransform(cv.width/W,0,0,cv.height/H,0,0);g.imageSmoothingQuality='high';
  drawBG();
  g.strokeStyle='rgba(0,0,0,.18)';g.setLineDash([6,8]);g.beginPath();g.moveTo(W/2,60);g.lineTo(W/2,H);g.stroke();g.setLineDash([]);
  drawBase('red');drawBase('blue');
  S.un.slice().sort((p,q)=>p.y-q.y).forEach(drawUnit);
  S.un.forEach(drawName);drawJets();
  g.strokeStyle='#ffe08a';g.lineWidth=1.5;
  S.ar.forEach(a=>{
    if(a.sh){g.fillStyle='rgba(255,170,60,.3)';g.beginPath();g.arc(a.x,a.y,6,0,7);g.fill();g.fillStyle='#ffb23d';g.beginPath();g.arc(a.x,a.y,3,0,7);g.fill();g.strokeStyle='#ff7a2e';g.beginPath();g.moveTo(a.x,a.y);g.lineTo(a.x-a.vx*2.5,a.y-a.vy*2.5);g.stroke()}
    else{g.strokeStyle='#ffe08a';g.beginPath();g.moveTo(a.x,a.y);g.lineTo(a.x-a.vx*1.6,a.y-a.vy*1.6);g.stroke()}
  });g.lineWidth=1;
  S.ln.forEach(l=>{g.strokeStyle=l.c;g.beginPath();g.moveTo(l.x1,l.y1);g.lineTo(l.x2,l.y2);g.stroke()});
  g.globalCompositeOperation='lighter';S.fx.forEach(p=>{g.globalAlpha=p.l/22;g.fillStyle=p.c;g.beginPath();g.arc(p.x,p.y,1+p.l/9,0,7);g.fill()});g.globalCompositeOperation='source-over';g.globalAlpha=1;
  drawPart();drawNight();vig();if(S.flash){g.fillStyle=`rgba(255,255,255,${S.flash/25})`;g.fillRect(0,0,W,H)}
  g.font='600 14px sans-serif';g.textAlign='center';
  S.tx.forEach(o=>{g.globalAlpha=Math.min(1,o.l/30);g.fillStyle='#4ade80';g.fillText(o.t,o.x,o.y)});g.globalAlpha=1;
  // HUD
  hpBar(10,'red');hpBar(W-250,'blue');
  
  
  g.fillStyle='#f4f7ff';g.textAlign='center';g.font='600 18px sans-serif';
  const s=Math.floor(S.time/60);g.fillText(Math.floor(s/60)+':'+String(s%60).padStart(2,'0'),W/2,22);g.font='600 11px sans-serif';g.fillText(SE[seaKey].i+' '+SE[seaKey].n+' · '+EFX[seaKey].t,W/2,37);
  [['red',10,'left'],['blue',W-10,'right']].forEach(([t,x,a])=>{
    const c=count(t),dl=S.delta[t];
    g.textAlign=a;g.fillStyle=COL[t];g.font='600 15px sans-serif';
    g.fillText(NAME[t]+' '+c,x,42);
    g.font='13px sans-serif';
    g.fillStyle=dl>0?'#4ade80':dl<0?'#ff8a8a':'#8fa3d6';
    g.fillText(dl>0?'▲ +'+dl:dl<0?'▼ '+dl:'– 0',x,58);
    g.fillStyle='#ffc83d';g.textAlign=t==='red'?'left':'right';g.fillText('WIN '+wins[t],t==='red'?x+62:x-62,58);
  });
}
(function loop(){update();ambient();draw();requestAnimationFrame(loop)})();

// ---------- settings panel ----------
function renderRules(){
  $('rules').innerHTML='';
  rules.forEach((r,i)=>{
    const row=document.createElement('div');row.className='row';
    const inp=document.createElement('input');inp.value=r.gift;inp.placeholder='ชื่อของขวัญ (อังกฤษ)';
    inp.oninput=()=>{r.gift=inp.value;save()};
    const sel=document.createElement('select');
    for(const k in FX)sel.add(new Option(FX[k],k));
    sel.value=FX[r.fx]?r.fx:'soldier';sel.onchange=()=>{r.fx=sel.value;save()};
    const mk=(txt,cls,team)=>{const b=document.createElement('button');b.textContent=txt;b.className=cls;
      b.onclick=()=>{$('panel').classList.remove('on');onGift({user:'ทดสอบ'+NAME[team],gift:r.gift,diamonds:1,count:1,team})};return b};
    const d=document.createElement('button');d.textContent='✕';
    d.onclick=()=>{rules.splice(i,1);save();renderRules()};
    row.append(inp,sel,mk('แดง','r','red'),mk('น้ำเงิน','b','blue'),d);$('rules').append(row);
  });
}
function renderSeen(){
  const box=$('seen');box.innerHTML='';
  if(!seen.length){box.textContent='ยังไม่มี';return}
  seen.forEach(n=>{
    const b=document.createElement('button');b.textContent='+ '+n;
    b.onclick=()=>{if(!rules.some(r=>r.gift.toLowerCase()===n.toLowerCase())){rules.push({gift:n,fx:'soldier'});save();renderRules()}};
    box.append(b);
  });
}
$('add').onclick=()=>{rules.push({gift:'',fx:'soldier'});save();renderRules()};
$('gear').onclick=()=>$('panel').classList.add('on');
$('rstg').onclick=()=>{$('panel').classList.remove('on');goHome()};
$('rsw').onclick=()=>{wins={red:0,blue:0};try{localStorage.setItem('wins',JSON.stringify(wins))}catch(e){}};
let dr=null;const pn=$('panel');
pn.addEventListener('touchstart',e=>{dr={x:e.touches[0].clientX,s:pn.scrollTop}},{passive:true});
pn.addEventListener('touchmove',e=>{if(dr&&document.body.classList.contains('rot'))pn.scrollTop=dr.s+e.touches[0].clientX-dr.x},{passive:true});
$('close').onclick=()=>$('panel').classList.remove('on');
// fullscreen toggle (Android/desktop browsers; iPhone Safari does not allow it)
const FSE=document.documentElement,fsOn=()=>document.fullscreenElement||document.webkitFullscreenElement,rqF=FSE.requestFullscreen||FSE.webkitRequestFullscreen;
if(navigator.standalone||matchMedia('(display-mode: standalone)').matches)$('fs').style.display='none';
$('fs').onclick=()=>{if(!rqF){note('เบราว์เซอร์นี้ไม่รองรับเต็มจอ — เปิดด้วย Chrome แล้วกด ⋮ → เพิ่มไปยังหน้าจอหลัก');return}try{
  if(fsOn())(document.exitFullscreen||document.webkitExitFullscreen).call(document);
  else{const p=rqF.call(FSE);if(p&&p.then)p.then(()=>{try{screen.orientation.lock('landscape').catch(()=>{})}catch(e){}}).catch(e=>note('เต็มจอไม่ได้: '+((e&&e.message)||e)))}
}catch(e){}};
['fullscreenchange','webkitfullscreenchange'].forEach(ev=>document.addEventListener(ev,()=>{$('fs').textContent=fsOn()?'✕':'⛶';if(!fsOn())try{screen.orientation.unlock()}catch(e){}fit();setTimeout(fit,300)}));
renderRules();

// ---------- live connection: Euler Stream WebSocket ----------
let ws,seenMsgs=0,dbgLines=[];
function dbg(t){dbgLines.push(String(t).slice(0,220));if(dbgLines.length>5)dbgLines.shift();$('dbg').textContent=dbgLines.join('\n')}
function connect(){
  save();
  if(ws){ws.onclose=null;ws.close()}
  const u=$('u').value.replace('@','').trim(),k=$('k').value.trim();
  if(!u||!k){$('st').textContent='ใส่ชื่อ TikTok และ API key ก่อน';return}
  $('st').textContent='กำลังเชื่อมต่อ...';seenMsgs=0;dbgLines=[];$('dbg').textContent='';
  ws=new WebSocket('wss://ws.eulerstream.com?uniqueId='+encodeURIComponent(u)+'&apiKey='+encodeURIComponent(k));
  ws.onopen=()=>{$('st').textContent='เชื่อมต่อแล้ว @'+u+' — รอของขวัญ'};
  ws.onmessage=e=>handle(e.data);
  ws.onerror=()=>{$('st').textContent='เชื่อมต่อไม่ได้ — เช็กชื่อ/กุญแจ และต้องกำลังไลฟ์อยู่'};
  ws.onclose=ev=>{$('st').textContent='หลุดการเชื่อมต่อ ('+ev.code+' '+(ev.reason||'')+')'};
}
async function handle(d){
  if(typeof d!=='string'){try{d=await new Blob([d]).text()}catch(e){return}}
  if(seenMsgs++<3||/gift/i.test(d))dbg(d);
  let j;try{j=JSON.parse(d)}catch(e){return}
  const list=Array.isArray(j.messages)?j.messages:[j];
  list.forEach(m=>{
    const t=String(m.type||m.method||m.event||'');
    const x=m.data||m.payload||m;
    const U=x.user||{};
    const who=U.uniqueId||U.nickname||x.uniqueId||'ผู้ชม';
    const nick=U.nickname||x.nickname||who;
    const pic=picOf(U)||x.profilePictureUrl||'';
    if(/chat/i.test(t)){const c=x.comment||x.content||'';if(c){prof(who,nick,pic);setTeam(who,String(c))}return}
    if(!/gift/i.test(t))return;
    const gd=x.giftDetails||x.gift||{};
    const type=x.giftType??gd.giftType??gd.type;
    if(type===1&&!x.repeatEnd)return;
    onGift({
      user:who,nick,pic,
      gift:x.giftName??gd.giftName??gd.name??'gift',
      diamonds:x.diamondCount??gd.diamondCount??gd.diamond_count??1,
      count:x.repeatCount||1
    });
  });
}
$('go').onclick=connect;
